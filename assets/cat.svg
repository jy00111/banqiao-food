<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" role="img" aria-label="馬尼喵">
  <defs>
    <clipPath id="head"><ellipse cx="100" cy="114" rx="74" ry="64"/></clipPath>
  </defs>
  <!-- 耳朵 -->
  <path d="M34 92 L46 18 L96 56 Z" fill="#B08A62" stroke="#4A3B2E" stroke-width="5" stroke-linejoin="round"/>
  <path d="M166 92 L154 18 L104 56 Z" fill="#B08A62" stroke="#4A3B2E" stroke-width="5" stroke-linejoin="round"/>
  <path d="M50 74 L55 36 L80 56 Z" fill="#F2C4BC"/>
  <path d="M150 74 L145 36 L120 56 Z" fill="#F2C4BC"/>
  <!-- 頭（白底） -->
  <ellipse cx="100" cy="114" rx="74" ry="64" fill="#FFFDF9"/>
  <g clip-path="url(#head)">
    <!-- 虎斑頭頂與眼周 -->
    <path d="M10 30 H190 V128 Q166 104 138 108 Q118 84 100 84 Q82 84 62 108 Q34 104 10 128 Z" fill="#B08A62"/>
    <!-- 額頭 M 字條紋 -->
    <path d="M74 54 Q80 70 86 80 M100 50 V78 M126 54 Q120 70 114 80" stroke="#4A3B2E" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M28 82 Q40 86 50 96 M172 82 Q160 86 150 96" stroke="#6E5440" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 腮紅 -->
    <ellipse cx="54" cy="140" rx="12" ry="7" fill="#F2C4BC" opacity=".7"/>
    <ellipse cx="146" cy="140" rx="12" ry="7" fill="#F2C4BC" opacity=".7"/>
  </g>
  <ellipse cx="100" cy="114" rx="74" ry="64" fill="none" stroke="#4A3B2E" stroke-width="5"/>
  <!-- 眼睛（橄欖綠） -->
  <g stroke="#4A3B2E" stroke-width="3.5">
    <ellipse cx="70" cy="114" rx="14" ry="15" fill="#A3A84E"/>
    <ellipse cx="130" cy="114" rx="14" ry="15" fill="#A3A84E"/>
  </g>
  <ellipse cx="70" cy="115" rx="5" ry="10" fill="#2E2620"/>
  <ellipse cx="130" cy="115" rx="5" ry="10" fill="#2E2620"/>
  <circle cx="74" cy="108" r="3.5" fill="#fff"/>
  <circle cx="134" cy="108" r="3.5" fill="#fff"/>
  <!-- 鼻子與嘴巴 -->
  <path d="M93 134 H107 Q107 142 100 145 Q93 142 93 134 Z" fill="#E8A598" stroke="#4A3B2E" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100 145 V150 M88 150 Q94 158 100 150 Q106 158 112 150" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 鬍鬚 -->
  <g stroke="#7A6858" stroke-width="2.5" stroke-linecap="round">
    <path d="M44 138 L6 130 M44 146 L8 150"/>
    <path d="M156 138 L194 130 M156 146 L192 150"/>
  </g>
</svg>
